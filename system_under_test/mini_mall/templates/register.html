{% extends "base.html" %}
{% block title %}注册 · 迷你商城{% endblock %}
{% block body %}
<h2>新用户注册</h2>
<p style="color:#666">需求：手机号为 11 位数字；密码至少 8 位且同时包含字母和数字；注册成功自动登录进入首页。</p>
<form method="post" action="{{ url_for('register') }}">
  <div><label>手机号</label><input name="phone" placeholder="11 位数字"></div>
  <div><label>密码</label><input type="password" name="password" placeholder="至少 8 位，含字母和数字"></div>
  <div><label>确认密码</label><input type="password" name="password2"></div>
  <button class="btn" type="submit">注册</button>
</form>
{% endblock %}
